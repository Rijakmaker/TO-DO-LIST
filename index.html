<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Kanban v2.1</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <div class="logo">Kanban<span>Pro</span></div>
            <div class="input-bar">
                <input type="text" id="taskName" placeholder="Task title...">
                <input type="date" id="taskDate">
                <input type="time" id="taskTime"> <select id="taskCategory">
                    <option value="Study">Study</option>
                    <option value="Work">Work</option>
                    <option value="Personal">Personal</option>
                </select>
                <button onclick="addTaskWithLoading()" id="addBtn" class="btn-add">Add Task</button>
            </div>
        </header>

        <main class="board">
            <div class="column" id="todo">
                <h3>To Do <span class="badge">0</span></h3>
                <div class="task-area"></div>
            </div>
            <div class="column" id="doing">
                <h3>In Progress <span class="badge">0</span></h3>
                <div class="task-area"></div>
            </div>
            <div class="column" id="done">
                <h3>Completed <span class="badge">0</span></h3>
                <div class="task-area"></div>
            </div>
        </main>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3>Update Task Details</h3>
            <div class="field-group">
                <label>Title</label>
                <input type="text" id="editNameInput">
            </div>
            <div class="field-group" style="margin-top:10px;">
                <label>Date</label>
                <input type="date" id="editDateInput">
            </div>
            <div class="field-group" style="margin-top:10px;">
                <label>Time</label>
                <input type="time" id="editTimeInput">
            </div>
            <div class="modal-actions" style="margin-top:20px;">
                <button onclick="saveEdit()" class="btn-add">Save Changes</button>
                <button onclick="closeModal()" class="btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
