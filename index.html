<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban To-Do List</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">
    <h1>Kanban To-Do List</h1>
    <button id="modeToggle">🌙 Dark Mode</button>
</div>

<div class="add-task-section">
    <input type="text" id="taskInput" placeholder="Add a new task...">
    <input type="date" id="deadlineInput">
    <input type="time" id="timeInput">
    <input type="text" id="categoryInput" placeholder="Category/Tag">
    <button id="addBtn">Add Task</button>
</div>

<div class="kanban-board">
    <div class="column" data-status="todo">
        <h2>To Do</h2>
        <ul id="todoList" class="task-column"></ul>
    </div>
    <div class="column" data-status="doing">
        <h2>Doing</h2>
        <ul id="doingList" class="task-column"></ul>
    </div>
    <div class="column" data-status="done">
        <h2>Done</h2>
        <ul id="doneList" class="task-column"></ul>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
